version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pi4_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pi4_db
      MYSQL_USER: tia
      MYSQL_PASSWORD: tia2026@unicap
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: